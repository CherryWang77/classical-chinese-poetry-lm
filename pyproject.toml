[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-lm"
version = "0.2.0"
description = "Tokenization-aware constrained generation for structured Chinese Song-ci"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Cherry Wang"}]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
data = [
  "datasketch>=1.6,<2",
  "scikit-learn>=1.5,<2",
]
research = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "datasets>=3.2,<5",
  "huggingface-hub>=0.27,<2",
  "peft>=0.14,<1",
  "datasketch>=1.6,<2",
  "scikit-learn>=1.5,<2",
  "transformers>=4.51,<5",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
report = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
]

[project.scripts]
poetry-lm = "poetry_lm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
